<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamLens AI — Mimari ve Veri Akış Şeması</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f15;
      color: #c7d5e0;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .diagram-card {
      background: linear-gradient(180deg, #101822 0%, #0d1219 100%);
      border: 1px solid rgba(102, 192, 244, 0.25);
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 1180px;
    }
    .header {
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #66c0f4;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .version-tag {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      background: rgba(102, 192, 244, 0.12);
      border: 1px solid rgba(102, 192, 244, 0.3);
      color: #66c0f4;
      padding: 4px 10px;
      border-radius: 6px;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .footer-legend {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
      font-size: 11px;
      font-family: 'Geist Mono', monospace;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8f98a0;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    <div class="header">
      <div>
        <div class="eyebrow">Sistem & Çift Motor Mimarisi</div>
        <h1>SteamLens AI — Veri Akış & Analiz Boru Hattı</h1>
      </div>
      <div class="version-tag">Manifest V3 • v1.2.0</div>
    </div>

    <!-- MAIN ARCHITECTURE SVG -->
    <svg viewBox="0 0 1120 540" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">SteamLens AI Mimari Şeması</title>
      <desc id="arch-desc">Steam DOM tetiklemesinden API çekimine, çift motor analizinden sonuç kartı üretimine kadar tüm veri akış şeması.</desc>

      <defs>
        <!-- Gradients -->
        <linearGradient id="grad-steam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1b2838"/>
          <stop offset="100%" stop-color="#141d27"/>
        </linearGradient>
        <linearGradient id="grad-gemini" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#221835"/>
          <stop offset="100%" stop-color="#160f24"/>
        </linearGradient>
        <linearGradient id="grad-nlp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#192819"/>
          <stop offset="100%" stop-color="#101c10"/>
        </linearGradient>
        <linearGradient id="grad-card" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#18273e"/>
          <stop offset="100%" stop-color="#111c2e"/>
        </linearGradient>

        <!-- Arrow Markers -->
        <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#66c0f4"/>
        </marker>
        <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#a4d007"/>
        </marker>
        <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#b388ff"/>
        </marker>
        <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8f98a0"/>
        </marker>
        <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#ff9900"/>
        </marker>
      </defs>

      <!-- ================= CONNECTOR PATHS (Drawn First Behind Nodes) ================= -->

      <!-- 1. Steam DOM -> content.js -->
      <path d="M 175 86 L 175 130" fill="none" stroke="#66c0f4" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <rect x="185" y="98" width="124" height="18" rx="3" fill="#0d141d" stroke="rgba(102,192,244,0.3)" stroke-width="0.8"/>
      <text x="247" y="111" fill="#8fbee0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">DOM ENJEKSİYONU</text>

      <!-- 2. content.js -> steam-api.js -->
      <path d="M 310 170 L 400 170" fill="none" stroke="#66c0f4" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <rect x="320" y="152" width="70" height="16" rx="3" fill="#0d141d" stroke="rgba(102,192,244,0.3)" stroke-width="0.8"/>
      <text x="355" y="164" fill="#8fbee0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">APP_ID İLE</text>

      <!-- 3. steam-api.js -> Steam Web API -->
      <path d="M 660 170 L 760 170" fill="none" stroke="#66c0f4" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <rect x="675" y="152" width="70" height="16" rx="3" fill="#0d141d" stroke="rgba(102,192,244,0.3)" stroke-width="0.8"/>
      <text x="710" y="164" fill="#8fbee0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP GET</text>

      <!-- 4. Steam Web API -> 3-Tier Spam Filter -->
      <path d="M 900 210 L 900 268 L 660 268" fill="none" stroke="#8f98a0" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <rect x="710" y="258" width="140" height="18" rx="3" fill="#0d141d" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <text x="780" y="271" fill="#c7d5e0" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">HAM İNCELEME JSON</text>

      <!-- 5. 3-Tier Spam Filter -> ai-engine.js -->
      <path d="M 400 268 L 175 268 L 175 330" fill="none" stroke="#a4d007" stroke-width="1.8" marker-end="url(#arr-green)"/>
      <rect x="220" y="258" width="150" height="18" rx="3" fill="#0d141d" stroke="rgba(164,208,7,0.3)" stroke-width="0.8"/>
      <text x="295" y="271" fill="#c4ea32" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">TEMİZLENMİŞ GERİ BİLDİRİM</text>

      <!-- 6. ai-engine.js -> Kural Tabanlı NLP -->
      <path d="M 310 360 L 400 360" fill="none" stroke="#a4d007" stroke-width="1.8" marker-end="url(#arr-green)"/>
      <rect x="320" y="342" width="70" height="16" rx="3" fill="#0d141d" stroke="rgba(164,208,7,0.3)" stroke-width="0.8"/>
      <text x="355" y="354" fill="#c4ea32" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">KURAL MODU</text>

      <!-- 7. ai-engine.js -> Gemini AI -->
      <path d="M 310 400 L 355 400 L 355 470 L 400 470" fill="none" stroke="#b388ff" stroke-width="1.8" marker-end="url(#arr-purple)"/>
      <rect x="310" y="445" width="80" height="16" rx="3" fill="#0d141d" stroke="rgba(179,136,255,0.3)" stroke-width="0.8"/>
      <text x="350" y="457" fill="#d2adff" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">GEMINI MODU</text>

      <!-- 8. Gemini Fallback -> NLP Modu -->
      <path d="M 700 470 L 740 470 L 740 380 L 700 380" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
      <rect x="710" y="415" width="80" height="18" rx="3" fill="#0d141d" stroke="rgba(255,153,0,0.4)" stroke-width="0.8"/>
      <text x="750" y="428" fill="#ffb84d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FALLBACK</text>

      <!-- 9. Engines -> Result UI Card -->
      <path d="M 700 350 L 800 350 L 800 385 L 830 385" fill="none" stroke="#66c0f4" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <path d="M 700 470 L 800 470 L 800 425 L 830 425" fill="none" stroke="#66c0f4" stroke-width="1.8" marker-end="url(#arr-blue)"/>


      <!-- ================= NODE BOXES ================= -->

      <!-- NODE 1: Steam Store Game Page (DOM) -->
      <g transform="translate(40, 18)">
        <rect width="270" height="68" rx="8" fill="url(#grad-steam)" stroke="#66c0f4" stroke-width="1.2"/>
        <rect x="12" y="10" width="76" height="14" rx="3" fill="rgba(102,192,244,0.12)" stroke="rgba(102,192,244,0.4)" stroke-width="0.8"/>
        <text x="50" y="20" fill="#66c0f4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">INPUT SOURCE</text>
        <text x="12" y="42" fill="#ffffff" font-size="13" font-family="'Geist', sans-serif" font-weight="700">Steam Mağaza Sayfası (DOM)</text>
        <text x="12" y="56" fill="#8f98a0" font-size="9.5" font-family="'Geist Mono', monospace">store.steampowered.com/app/*</text>
      </g>

      <!-- NODE 2: content.js (SPA Observer) -->
      <g transform="translate(40, 130)">
        <rect width="270" height="78" rx="8" fill="url(#grad-steam)" stroke="#66c0f4" stroke-width="1.5"/>
        <rect x="12" y="10" width="86" height="14" rx="3" fill="rgba(102,192,244,0.15)" stroke="#66c0f4" stroke-width="0.8"/>
        <text x="55" y="20" fill="#66c0f4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">CONTENT SCRIPT</text>
        <text x="12" y="42" fill="#ffffff" font-size="14" font-family="'Geist', sans-serif" font-weight="700">content.js</text>
        <text x="12" y="58" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">SPA MutationObserver (350ms Debounce)</text>
        <text x="12" y="70" fill="#626f80" font-size="9" font-family="'Geist Mono', monospace">Dinamik Buton &amp; Başlık Algılama</text>
      </g>

      <!-- NODE 3: steam-api.js -->
      <g transform="translate(400, 130)">
        <rect width="260" height="78" rx="8" fill="url(#grad-steam)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <rect x="12" y="10" width="70" height="14" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
        <text x="47" y="20" fill="#c7d5e0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">API CLIENT</text>
        <text x="12" y="42" fill="#ffffff" font-size="14" font-family="'Geist', sans-serif" font-weight="700">steam-api.js</text>
        <text x="12" y="58" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">Sayfalanmış İnceleme İstekleri</text>
        <text x="12" y="70" fill="#626f80" font-size="9" font-family="'Geist Mono', monospace">Cursor &amp; Dil Filtreleme Yönetimi</text>
      </g>

      <!-- NODE 4: Steam Web API (External) -->
      <g transform="translate(760, 130)">
        <rect width="280" height="78" rx="8" fill="#141d26" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="12" y="10" width="90" height="14" rx="3" fill="rgba(79,93,117,0.2)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="57" y="20" fill="#8f98a0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">EXTERNAL API</text>
        <text x="12" y="42" fill="#ffffff" font-size="13" font-family="'Geist', sans-serif" font-weight="700">Steam Web Reviews API</text>
        <text x="12" y="58" fill="#8f98a0" font-size="9.5" font-family="'Geist Mono', monospace">/appreviews/{app_id}?json=1</text>
        <text x="12" y="70" fill="#626f80" font-size="9" font-family="'Geist', sans-serif">Açık Genel Erişim (Anahtarsız)</text>
      </g>

      <!-- NODE 5: 3-Tier Spam Filter -->
      <g transform="translate(400, 234)">
        <rect width="260" height="68" rx="8" fill="#16221c" stroke="#a4d007" stroke-width="1"/>
        <rect x="12" y="8" width="96" height="14" rx="3" fill="rgba(164,208,7,0.15)" stroke="#a4d007" stroke-width="0.8"/>
        <text x="60" y="18" fill="#a4d007" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">DATA CLEANING</text>
        <text x="12" y="38" fill="#ffffff" font-size="12" font-family="'Geist', sans-serif" font-weight="700">3 Katmanlı Spam &amp; Meme Filtresi</text>
        <text x="12" y="54" fill="#8f98a0" font-size="9" font-family="'Geist', sans-serif">ASCII / BBCode / Copypasta Ayıklama</text>
      </g>

      <!-- NODE 6: ai-engine.js Pipeline Hub -->
      <g transform="translate(40, 330)">
        <rect width="270" height="88" rx="8" fill="url(#grad-steam)" stroke="#66c0f4" stroke-width="1.5"/>
        <rect x="12" y="10" width="104" height="14" rx="3" fill="rgba(102,192,244,0.15)" stroke="#66c0f4" stroke-width="0.8"/>
        <text x="64" y="20" fill="#66c0f4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">DUAL-ENGINE CORE</text>
        <text x="12" y="44" fill="#ffffff" font-size="14" font-family="'Geist', sans-serif" font-weight="700">ai-engine.js</text>
        <text x="12" y="62" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">Çift Motor Yönlendirici &amp; Fallback</text>
        <text x="12" y="76" fill="#626f80" font-size="9" font-family="'Geist Mono', monospace">Kural Tabanlı &lt;=&gt; Bulut Gemini</text>
      </g>

      <!-- ENGINE A: Kural Tabanli NLP (Hizli) -->
      <g transform="translate(400, 320)">
        <rect width="300" height="74" rx="8" fill="url(#grad-nlp)" stroke="#a4d007" stroke-width="1.2"/>
        <rect x="12" y="8" width="110" height="14" rx="3" fill="rgba(164,208,7,0.15)" stroke="#a4d007" stroke-width="0.8"/>
        <text x="67" y="18" fill="#a4d007" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">🚀 0ms OFFLINE NLP</text>
        <text x="12" y="38" fill="#ffffff" font-size="12.5" font-family="'Geist', sans-serif" font-weight="700">Kural Tabanlı İstatistik Motoru</text>
        <text x="12" y="52" fill="#9ec940" font-size="9.5" font-family="'Geist', sans-serif">RegEx Frekans &amp; Matematiksel Duygu Skoru</text>
        <text x="12" y="64" fill="#626f80" font-size="8.5" font-family="'Geist Mono', monospace">Sıfır GPU / Sıfır Ağ Maliyeti</text>
      </g>

      <!-- ENGINE B: Gemini AI (Bulut) -->
      <g transform="translate(400, 430)">
        <rect width="300" height="74" rx="8" fill="url(#grad-gemini)" stroke="#b388ff" stroke-width="1.2"/>
        <rect x="12" y="8" width="90" height="14" rx="3" fill="rgba(179,136,255,0.15)" stroke="#b388ff" stroke-width="0.8"/>
        <text x="57" y="18" fill="#c78aff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">⚡ CLOUD LLM</text>
        <text x="12" y="38" fill="#ffffff" font-size="12.5" font-family="'Geist', sans-serif" font-weight="700">Google Gemini 3.6 Flash</text>
        <text x="12" y="52" fill="#c09bf8" font-size="9.5" font-family="'Geist', sans-serif">Yapılandırılmış JSON • Doğal Dil Sentezi</text>
        <text x="12" y="64" fill="#8a6db5" font-size="8.5" font-family="'Geist Mono', monospace">Google AI Studio REST API</text>
      </g>

      <!-- NODE 8: Result UI Card -->
      <g transform="translate(830, 320)">
        <rect width="250" height="184" rx="8" fill="url(#grad-card)" stroke="#66c0f4" stroke-width="1.5"/>
        <rect x="12" y="10" width="80" height="14" rx="3" fill="rgba(102,192,244,0.15)" stroke="#66c0f4" stroke-width="0.8"/>
        <text x="52" y="20" fill="#66c0f4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">OUTPUT UI</text>
        <text x="12" y="44" fill="#ffffff" font-size="14" font-family="'Geist', sans-serif" font-weight="700">SteamLens Rapor Kartı</text>
        
        <g transform="translate(12, 60)">
          <text x="0" y="12" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">⚡ Optimizasyon Sağlık Skoru (%0-100)</text>
          <text x="0" y="28" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">🟢 Güçlü Yönler (Övülen Mekanikler)</text>
          <text x="0" y="44" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">🔴 Kritik Sorunlar &amp; Şikayetler</text>
          <text x="0" y="60" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">⚡ Son Güncellemeler &amp; Yama Durumu</text>
          <text x="0" y="76" fill="#a0b3c6" font-size="10" font-family="'Geist', sans-serif">⏱️ Fiyat / Süre / Değer Analizi</text>
          <text x="0" y="98" fill="#66c0f4" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="600">📋 Tek Tıkla Panoya Kopyalama</text>
        </g>
      </g>

    </svg>

    <!-- FOOTER LEGEND -->
    <div class="footer-legend">
      <div class="legend-item">
        <span class="dot" style="background:#66c0f4;"></span>
        <span>Ana Kontrol &amp; Veri Akışı</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background:#a4d007;"></span>
        <span>Hızlı NLP &amp; Temizleme Hattı</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background:#b388ff;"></span>
        <span>Google Gemini AI (Bulut)</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background:#ff9900;"></span>
        <span>Otomatik Geri Dönüş (Fallback)</span>
      </div>
      <div class="legend-item">
        <span class="dot" style="background:#4f5d75;"></span>
        <span>Harici Web Servisleri</span>
      </div>
    </div>
  </div>

</body>
</html>
