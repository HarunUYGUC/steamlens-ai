    .diagram-card {

      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 1180px;
    }
    .header {
      margin-bottom: 20px;

      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

      padding: 4px 10px;

      width: 100%;
      height: auto;
    }
    .footer-legend {

      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 14px;
      font-size: 11.5px;
      font-family: 'Geist Mono', monospace;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8f98a0;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
